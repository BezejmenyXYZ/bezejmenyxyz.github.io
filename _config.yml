title: Bezejmeny
description: Epic Minecraft server is Coming..
url: https://bezejmeny.xyz
baseurl: ""

# GitHub Pages specific settings
plugins:
  - jekyll-redirect-from

# Ensure 404.html is served for all missing pages
permalink: pretty

# Include the 404.html in builds
include:
  - 404.html
  - .htaccess

# Exclude PHP files and backend directories from Jekyll builds
exclude:
  - .htaccess-for-online
  - "*.php"
  - admin/
  - api/
  - register/
  - founders/
  - includes/
  - cache/
  - logs/
  - vendor/
  - composer.json
  - composer.lock
  - README.md
  - DOMAIN-SETUP.md

# Security headers and SEO
defaults:
  - scope:
      path: ""
    values:
      layout: "default"